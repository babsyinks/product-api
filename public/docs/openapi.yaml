openapi: 3.0.3
info:
  title: 'Product API'
  description: 'A clean RESTful API for managing products, built with Laravel.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
paths:
  /api/v1/register:
    post:
      summary: Register
      operationId: register
      description: 'Creates a new user account and returns a Sanctum API token.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|abc123...
                  token_type: Bearer
                properties:
                  token:
                    type: string
                    example: 1|abc123...
                  token_type:
                    type: string
                    example: Bearer
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Full name.'
                  example: 'Jane Doe'
                  nullable: false
                email:
                  type: string
                  description: 'Email address.'
                  example: jane@example.com
                  nullable: false
                password:
                  type: string
                  description: 'Password (min 8 chars).'
                  example: secret123
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: secret123
                  nullable: false
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/login:
    post:
      summary: Login
      operationId: login
      description: 'Authenticates a user and returns a Sanctum API token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|abc123...
                  token_type: Bearer
                properties:
                  token:
                    type: string
                    example: 1|abc123...
                  token_type:
                    type: string
                    example: Bearer
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The provided credentials are incorrect.'
                  errors:
                    email:
                      - 'The provided credentials are incorrect.'
                properties:
                  message:
                    type: string
                    example: 'The provided credentials are incorrect.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The provided credentials are incorrect.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Registered email.'
                  example: admin@example.com
                  nullable: false
                password:
                  type: string
                  description: Password.
                  example: password
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/v1/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revokes the current API token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully.'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully.'
      tags:
        - Authentication
  /api/v1/me:
    get:
      summary: Me
      operationId: me
      description: 'Returns the currently authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Jane Doe'
                  email: jane@example.com
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Jane Doe'
                  email:
                    type: string
                    example: jane@example.com
      tags:
        - Authentication
  /api/v1/products:
    get:
      summary: 'List products'
      operationId: listProducts
      description: "Returns a paginated list of products. Supports full-text search,\nprice-range and stock filters, and column sorting."
      parameters:
        -
          in: query
          name: search
          description: 'Filter by name or description.'
          example: headphones
          required: false
          schema:
            type: string
            description: 'Filter by name or description.'
            example: headphones
            nullable: false
        -
          in: query
          name: min_price
          description: 'Filter products with price ≥ this value.'
          example: 10.0
          required: false
          schema:
            type: number
            description: 'Filter products with price ≥ this value.'
            example: 10.0
            nullable: false
        -
          in: query
          name: max_price
          description: 'Filter products with price ≤ this value.'
          example: 500.0
          required: false
          schema:
            type: number
            description: 'Filter products with price ≤ this value.'
            example: 500.0
            nullable: false
        -
          in: query
          name: in_stock
          description: 'Return only in-stock (true) or out-of-stock (false) products.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Return only in-stock (true) or out-of-stock (false) products.'
            example: true
            nullable: false
        -
          in: query
          name: sort_by
          description: 'Column to sort by. Allowed: price, created_at, name. Defaults to created_at.'
          example: price
          required: false
          schema:
            type: string
            description: 'Column to sort by. Allowed: price, created_at, name. Defaults to created_at.'
            example: price
            nullable: false
        -
          in: query
          name: sort_dir
          description: 'Sort direction: asc or desc. Defaults to desc.'
          example: asc
          required: false
          schema:
            type: string
            description: 'Sort direction: asc or desc. Defaults to desc.'
            example: asc
            nullable: false
        -
          in: query
          name: per_page
          description: 'Number of results per page (1–100). Defaults to 15.'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Number of results per page (1–100). Defaults to 15.'
            example: 20
            nullable: false
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: uuid
                      name: ...
                      price: 99.99
                      stock: 10
                      in_stock: true
                      created_at: ...
                  links:
                    first: ...
                    last: ...
                    prev: null
                    next: ...
                  meta:
                    current_page: 1
                    per_page: 15
                    total: 100
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: uuid
                        name: ...
                        price: 99.99
                        stock: 10
                        in_stock: true
                        created_at: ...
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: uuid
                        name:
                          type: string
                          example: ...
                        price:
                          type: number
                          example: 99.99
                        stock:
                          type: integer
                          example: 10
                        in_stock:
                          type: boolean
                          example: true
                        created_at:
                          type: string
                          example: ...
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: ...
                      last:
                        type: string
                        example: ...
                      prev:
                        type: string
                        example: null
                      next:
                        type: string
                        example: ...
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 100
      tags:
        - Products
      security: []
    post:
      summary: 'Create a product'
      operationId: createAProduct
      description: 'Creates a new product. Requires authentication.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: uuid
                    name: 'Premium Headphones'
                    price: 99.99
                    stock: 50
                    in_stock: true
                    created_at: ...
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: uuid
                      name:
                        type: string
                        example: 'Premium Headphones'
                      price:
                        type: number
                        example: 99.99
                      stock:
                        type: integer
                        example: 50
                      in_stock:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: ...
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The name field is required.'
                  errors:
                    name:
                      - 'The name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The name field is required.'
                  errors:
                    type: object
                    properties:
                      name:
                        type: array
                        example:
                          - 'The name field is required.'
                        items:
                          type: string
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The product name. Max 255 characters.'
                  example: 'Premium Headphones'
                  nullable: false
                description:
                  type: string
                  description: 'nullable A detailed product description.'
                  example: 'High-fidelity over-ear headphones with noise cancellation.'
                  nullable: true
                price:
                  type: number
                  description: 'The product price (must be ≥ 0).'
                  example: 99.99
                  nullable: false
                stock:
                  type: integer
                  description: 'Current stock level (must be ≥ 0).'
                  example: 50
                  nullable: false
              required:
                - name
                - price
                - stock
  '/api/v1/products/{product_id}':
    get:
      summary: 'Get a product'
      operationId: getAProduct
      description: 'Returns a single product by its UUID.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: uuid
                    name: 'Premium Headphones'
                    price: 99.99
                    stock: 50
                    in_stock: true
                    created_at: ...
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: uuid
                      name:
                        type: string
                        example: 'Premium Headphones'
                      price:
                        type: number
                        example: 99.99
                      stock:
                        type: integer
                        example: 50
                      in_stock:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: ...
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Product].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Product].'
      tags:
        - Products
      security: []
    put:
      summary: 'Update a product'
      operationId: updateAProduct
      description: "Updates an existing product. Requires authentication.\nAll fields are optional — send only what you want to change."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: uuid
                    name: 'Premium Headphones v2'
                    price: 109.99
                    stock: 30
                    in_stock: true
                    updated_at: ...
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: uuid
                      name:
                        type: string
                        example: 'Premium Headphones v2'
                      price:
                        type: number
                        example: 109.99
                      stock:
                        type: integer
                        example: 30
                      in_stock:
                        type: boolean
                        example: true
                      updated_at:
                        type: string
                        example: ...
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Product].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Product].'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The price must be at least 0.'
                  errors:
                    price:
                      - 'The price must be at least 0.'
                properties:
                  message:
                    type: string
                    example: 'The price must be at least 0.'
                  errors:
                    type: object
                    properties:
                      price:
                        type: array
                        example:
                          - 'The price must be at least 0.'
                        items:
                          type: string
      tags:
        - Products
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The product name. Max 255 characters.'
                  example: 'Premium Headphones v2'
                  nullable: false
                description:
                  type: string
                  description: 'nullable A detailed product description.'
                  example: 'Updated noise-cancelling model.'
                  nullable: true
                price:
                  type: number
                  description: 'The product price (must be ≥ 0).'
                  example: 109.99
                  nullable: false
                stock:
                  type: integer
                  description: 'Current stock level (must be ≥ 0).'
                  example: 30
                  nullable: false
    delete:
      summary: 'Delete a product'
      operationId: deleteAProduct
      description: "Soft-deletes a product. The record is retained in the database\nand can be restored. Requires authentication."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Product deleted successfully.'
                properties:
                  message:
                    type: string
                    example: 'Product deleted successfully.'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Product].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Product].'
      tags:
        - Products
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: a1b28621-c14f-4df2-9ad3-eded3dd48bd5
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The product UUID.'
        example: 9c7e5b2a-1234-4abc-8def-000000000001
        required: true
        schema:
          type: string
  /api/login:
    get:
      summary: ''
      operationId: getApiLogin
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Please provide a valid Bearer token.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Please provide a valid Bearer token.'
      tags:
        - Endpoints
      security: []
tags:
  -
    name: Authentication
    description: "\nEndpoints for obtaining and revoking API tokens (Laravel Sanctum)."
  -
    name: Products
    description: "\nEndpoints for managing the product catalogue."
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token via POST /api/v1/login. Pass it as: Authorization: Bearer {token}'
security:
  -
    default: []
