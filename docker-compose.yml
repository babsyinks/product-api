services:

  # PHP Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: product_api_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor          # anonymous volume — keeps host vendor out
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: product_api
      DB_USERNAME: product_user
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - product_network

  # MySQL 8
  db:
    image: mysql:8.0
    container_name: product_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: product_api
      MYSQL_USER: product_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - product_network

  # phpMyAdmin (optional dev UI)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: product_api_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootsecret
    depends_on:
      - db
    networks:
      - product_network
    profiles: ["dev"]   # only starts with: docker compose --profile dev up

networks:
  product_network:
    driver: bridge

volumes:
  db_data:
